# ── 운영(AWS 등) 프로파일 ──
# 모든 접속정보는 환경변수/시크릿으로만 주입한다. 이 파일에 실제 값 절대 금지.
# 실행: SPRING_PROFILES_ACTIVE=prod DB_URL=... DB_USERNAME=... DB_PASSWORD=... java -jar app.jar
spring:
  datasource:
    url: ${DB_URL}
    username: ${DB_USERNAME}
    password: ${DB_PASSWORD}
  jpa:
    show-sql: false

server:
  # ALB/프록시가 TLS 종단 → X-Forwarded-Proto를 신뢰해 HTTPS로 인식(HSTS 헤더 실제 방출).
  forward-headers-strategy: framework

app:
  storage:
    local:
      # provider=local(운영 기본)의 바이트 저장 루트. 공통 기본값은 빈 문자열 = java.io.tmpdir이라,
      # compose 밖에서(맨몸 java -jar) 뜨면 업로드가 임시 디렉터리로 새고 재부팅 때 사진이 전멸한다.
      # → 운영 기본값을 영구 경로로 고정한다. 이 경로는 반드시 영구 볼륨/디스크여야 한다.
      dir: ${STORAGE_LOCAL_DIR:/var/lib/damoim/storage}
      # 기본값을 두지 않는다(공통과 동일하게 빈 값) — 비면 LocalStorageSigner가 prod에서 부팅을 거부한다.
      # 랜덤 폴백을 운영에 허용하면 재시작마다 서명 키가 바뀌어 이미 배포된 모든 파일 URL이 403이 된다.
      sign-secret: ${STORAGE_LOCAL_SIGN_SECRET:}
  billing:
    # 운영 기본값을 true로 뒤집는다(공통 기본값 false는 개발 편의용).
    # 검증이 꺼진 운영은 곧 "결제 없이 subscribe만 호출하면 PRO" 구멍이므로, 굳이 BILLING_VERIFY=false를
    # 넣더라도 PurchaseVerifier가 구독 요청 자체를 거부한다(fail-open 금지).
    # → 운영에서 유료 구독을 받으려면 APPLE_BUNDLE_ID + APPLE_ROOT_CERT_PATH를 반드시 채워야 한다.
    verify-purchases: ${BILLING_VERIFY:true}
